{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>Forgot Password</h2>
    <p>Enter your email address and we will send you instructions to reset your password.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send Reset Instructions</button>
    </form>
</div>
{% endblock %}
