{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2 class="mb-4">Expense Claims & Financial Disbursements Portal</h2>
        
        <!-- Submit Claim Form Card -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h4 class="card-title mb-3">Submit New Expense Claim</h4>
                <form id="claimForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="claimType" class="form-label">Claim Type</label>
                            <input type="text" class="form-control" id="claimType" required placeholder="e.g., Funeral & Welfare Support">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="claimAmount" class="form-label">Amount ($)</label>
                            <input type="number" step="0.01" class="form-control" id="claimAmount" required placeholder="0.00">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="claimDescription" class="form-label">Description / Details</label>
                        <textarea class="form-control" id="claimDescription" rows="3" required placeholder="Provide context for this expense..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit Claim</button>
                </form>
            </div>
        </div>
        
        <!-- Claims History & Status Tracking Table -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-3">My Claims History</h4>
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Claim Type</th>
                            <th>Amount</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Submitted Date</th>
                        </tr>
                    </thead>
                    <tbody id="claimsTableBody">
                        <tr>
                            <td colspan="6" class="text-center text-muted">Loading claims records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        fetchClaimsRecords();

        document.getElementById("claimForm").addEventListener("submit", function(e) {
            e.preventDefault();
            submitNewClaim();
        });
    });

    async function fetchClaimsRecords() {
        const tableBody = document.getElementById("claimsTableBody");
        if (!tableBody) return;
        
        try {
            const response = await fetch('/api/claims/', {
                headers: { "Accept": "application/json" }
            }); 
            
            if (!response.ok) throw new Error(`Server returned status ${response.status}`);

            const data = await response.json();
            tableBody.innerHTML = ""; 
            
            const records = Array.isArray(data) ? data : (data.results || []);

            if (records.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No expense claims found.</td></tr>`;
                return;
            }

            records.forEach(record => {
                let badgeClass = 'secondary';
                if (record.status === 'APPROVED') badgeClass = 'success';
                else if (record.status === 'PENDING') badgeClass = 'warning text-dark';
                else if (record.status === 'REJECTED') badgeClass = 'danger';
                else if (record.status === 'PAID') badgeClass = 'info text-dark';

                tableBody.innerHTML += `
                    <tr>
                        <td>${record.id}</td>
                        <td><strong>${record.claim_type}</strong></td>
                        <td>$${parseFloat(record.amount).toFixed(2)}</td>
                        <td>${record.description}</td>
                        <td><span class="badge bg-${badgeClass}">${record.status}</span></td>
                        <td>${new Date(record.created_at).toLocaleDateString()}</td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error("Error loading claims:", error);
            tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">Error loading data.</td></tr>`;
        }
    }

    async function submitNewClaim() {
        const claim_type = document.getElementById("claimType").value;
        const amount = document.getElementById("claimAmount").value;
        const description = document.getElementById("claimDescription",).value;

        try {
            const response = await fetch('/api/claims/', {
                method: 'POST',
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                    "X-CSRFToken": getCookie('csrftoken')
                },
                body: JSON.stringify({ claim_type, amount, description })
            });

            const resultData = await response.json();

            if (response.ok) {
                alert("Expense claim submitted successfully!");
                document.getElementById("claimForm").reset();
                fetchClaimsRecords();
            } else {
                let errorMsg = "Failed to submit claim.";
                const firstKey = Object.keys(resultData)[0];
                if (firstKey) {
                    const val = resultData[firstKey];
                    errorMsg = Array.isArray(val) ? val[0] : val;
                }
                alert(errorMsg);
            }
        } catch (error) {
            console.error("Error:", error);
            alert("An error occurred while communicating with the server.");
        }
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
{% endblock %}
