<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Enterprise HRMS{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f5f7fa;
        }

        .hrms-navbar {
            background: #172b4d;
        }

        .hrms-brand {
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .hrms-nav-link {
            color: rgba(255, 255, 255, 0.85) !important;
        }

        .hrms-nav-link:hover {
            color: #ffffff !important;
        }

        .page-container {
            padding-top: 28px;
            padding-bottom: 40px;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark hrms-navbar shadow-sm">
    <div class="container-fluid px-4">

        <a class="navbar-brand hrms-brand" href="/dashboard/">
            Enterprise HRMS
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#hrmsNavigation"
            aria-controls="hrmsNavigation"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="hrmsNavigation">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link hrms-nav-link" href="/dashboard/">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link hrms-nav-link" href="/leave-dashboard/">
                        Leave
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link hrms-nav-link" href="/attendance-dashboard/">
                        Attendance
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link hrms-nav-link" href="/claims-dashboard/">
                        Claims
                    </a>
                </li>

            </ul>

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link hrms-nav-link" href="/admin/">
                        Administration
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>

<main class="container-fluid px-4 page-container">

    {% block content %}
    {% endblock %}

</main>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

{% block extra_js %}
{% endblock %}

</body>
</html>
